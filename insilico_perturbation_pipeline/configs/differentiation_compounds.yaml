description: 'Curated differentiation compounds, indexed by signaling pathway. This is the ''biologist common sense filter''
  for Phase 8 chemical candidate aggregation: when our pipeline detects an enriched pathway (via GSEA, PROGENy, or DGIdb),
  we map it to known-good cell-culture compounds from this table rather than returning every drug DGIdb knows about. Source:
  docs/originals/AGImodel.xlsx (collaborator-curated, 2026-04-13).'
source_file: docs/originals/AGImodel.xlsx
last_updated: '2026-04-14'
