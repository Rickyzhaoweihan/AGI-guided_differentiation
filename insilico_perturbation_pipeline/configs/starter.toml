# Configuration for training STATE model on competition subset (subsampled data)
#
# This config uses a smaller subset of the Replogle-Nadig dataset (~40K cells)
# for faster training and testing. Suitable for initial experiments.
#
# Usage:
#   python scripts/train_state_model.py --config configs/starter.toml

# Dataset paths - maps dataset names to their directories
# Update the path below to point to your data location
[datasets]
replogle_h1 = "/path/to/data/competition_support_set/{competition_train,k562_gwps,rpe1,jurkat,k562,hepg2}.h5"

# Training specifications
[training]
replogle_h1 = "train"

# Zeroshot specifications - entire cell types go to val or test
[zeroshot]
"replogle_h1.hepg2" = "test"

# Fewshot specifications - explicit perturbation lists
[fewshot]
